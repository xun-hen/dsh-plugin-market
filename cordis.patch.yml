# dsh-plugin-market bundle patch: one dual-face row. The Host half registers
# the read-only market route under /api/dsh-plugin-market, and the `dsh.client`
# declaration in package.json loads the browser half that draws the sidebar
# entry and the center-column page.
- insert:
    - id: plugin-market
      name: '@local/dsh-plugin-market'
